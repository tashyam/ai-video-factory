name: Generate AI Video
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Setup FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run Engine
        run: php engine.php
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: my-final-video
          path: ./*.mp4  # This tells the robot to look everywhere for any MP4 file
