name: 3D Cartoon Video Factory
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic (leave blank for default)'
        required: false
        default: 'auto'
  schedule:
    - cron: '0 12 * * *'

jobs:
  render-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install System Deps & Python Libs
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts requests
      - name: Cache 3D Engine & Chromium
        id: cache-3d
        uses: actions/cache@v4
        with:
          path: |
            3d-video-studio/kit
            ~/.cache/ms-playwright
          key: 3d-studio-v1-${{ hashFiles('3d-video-studio/setup.sh') }}
      - name: Install Engine (Only on First Run)
        if: steps.cache-3d.outputs.cache-hit != 'true'
        run: |
          cd 3d-video-studio
          bash setup.sh
      - name: Link Engine Node Modules & Install OS Deps
        run: |
          ln -sfn "$(pwd)/3d-video-studio/kit/node_modules" 3d-video-studio/engine/node_modules
          cd 3d-video-studio/kit
          npx playwright install-deps chromium
      - name: Generate & Render 3D Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python factory.py "${{ github.event.inputs.topic }}"
      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-cartoon-video
          path: 3d-video-studio/project_out/out/final_short.mp4
