name: 3D Cartoon Video Factory
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic (leave blank for default)'
        required: false
        default: 'auto'
  schedule:
    - cron: '0 12 * * *'

jobs:
  render-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore 3D Engine & Chromium Cache
        id: cache-3d
        uses: actions/cache/restore@v4
        with:
          path: |
            3d-video-studio/kit
            ~/.cache/ms-playwright
          key: 3d-studio-v3-${{ hashFiles('3d-video-studio/setup.sh') }}
      - name: Install FFmpeg, Engine & Python Libs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts gTTS requests
          if [ "${{ steps.cache-3d.outputs.cache-hit }}" != "true" ]; then
            cd 3d-video-studio && bash setup.sh && cd ..
          fi
          NM_SRC=$(find 3d-video-studio -maxdepth 3 -name "three" -type d | head -n 1 | xargs dirname)
          echo "Found node_modules at: $NM_SRC"
          ln -sfn "$(pwd)/$NM_SRC" 3d-video-studio/engine/node_modules
      - name: Save 3D Engine & Chromium Cache (Always)
        if: always() && steps.cache-3d.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            3d-video-studio/kit
            ~/.cache/ms-playwright
          key: 3d-studio-v3-${{ hashFiles('3d-video-studio/setup.sh') }}
      - name: Generate & Render 3D Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python factory.py "${{ github.event.inputs.topic }}"
      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-cartoon-video
          path: 3d-video-studio/project_out/out/final_short.mp4
