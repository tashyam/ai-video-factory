name: Generate AI Video
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Factory
        run: php engine.php

      - name: Upload Masterpiece
        if: always() # This ensures we see the log even if it fails
        uses: actions/upload-artifact@v4
        with:
          name: completed-video
          path: ./*.mp4
