name: 3D Cartoon Video Factory
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic (leave blank for default)'
        required: false
        default: 'Why drivers started filming the road'
  schedule:
    - cron: '0 12 * * *'

jobs:
  render-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg, Playwright & Edge-TTS
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts requests
          cd 3d-video-studio/engine
          npm install
          npx playwright install --with-deps chromium
      - name: Generate & Render 3D Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python factory.py "${{ github.event.inputs.topic }}"
      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-cartoon-video
          path: 3d-video-studio/project_out/out/final_short.mp4
