name: 3D Cartoon Video Factory
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic (leave blank for default)'
        required: false
        default: 'auto'
  schedule:
    - cron: '0 12 * * *'

jobs:
  render-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore 3D Engine & Chromium Cache
        id: cache-3d
        uses: actions/cache/restore@v4
        with:
          path: |
            3d-video-studio/engine/node_modules
            3d-video-studio/kit
            ~/.cache/ms-playwright
          key: 3d-studio-v4-${{ hashFiles('3d-video-studio/setup.sh') }}
      - name: Install FFmpeg, Repo Setup & Python Libs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts gTTS requests
          bash 3d-video-studio/setup.sh
      - name: Save 3D Engine & Chromium Cache (Always)
        if: always() && steps.cache-3d.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            3d-video-studio/engine/node_modules
            3d-video-studio/kit
            ~/.cache/ms-playwright
          key: 3d-studio-v4-${{ hashFiles('3d-video-studio/setup.sh') }}
      - name: Generate & Render 3D Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed -i "s/FPS = 30, W = 1080, H = 1920/FPS = 20, W = 360, H = 640/g" 3d-video-studio/engine/film.mjs
          sed -i "s/for (let i = 0; i < n; i++) {/for (let i = 0; i < n; i++) { if (i % 30 === 0) console.log('Rendering frame ' + i + '\/' + n);/g" 3d-video-studio/engine/film.mjs
          python factory.py "${{ github.event.inputs.topic }}"
      - name: Upload MP4 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-cartoon-video
          path: 3d-video-studio/project_out/out/final_short.mp4
